name: 🔑 TEST Daily Data Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_pipeline]

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout SocialMedia Repo
        uses: actions/checkout@v4
        with:
          repository: manishsinha2107/socialmedia
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          path: social_repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added playwright and google-api-python-client for the downloader
          pip install pandas numpy supabase google-auth openpyxl requests python-dotenv pyotp pytz websocket-client fyers-apiv3 playwright google-api-python-client
          
          # CRITICAL: Install Chromium and system dependencies for the downloader
          playwright install chromium --with-deps

          # Install Social Media dependencies
          pip install -r social_repo/requirements.txt

      - name: Run Sequence
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/social_repo
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_USERNAME: ${{ secrets.FYERS_USERNAME }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
          SOURCE_FOLDER: ${{ secrets.SOURCE_FOLDER }}
          DEST_FOLDER: ${{ secrets.DEST_FOLDER }}
          MASTER_BOT_TOKEN: ${{ secrets.MASTER_BOT_TOKEN }}
          PERSONAL_CHANNEL_ID: ${{ secrets.PERSONAL_CHANNEL_ID }}
        run: |


          echo "🚀 Step 6: PnL OHLC (High-Fi)"
          python scripts/6_pnl_refresh.py

          echo "🚀 Step 7: Daily Strategy PNL Table"
          python scripts/7_expectency_calc.py
          
          echo "🚀 Step 8: Expectency Update"
          python social_repo/scripts/4_personal_broadcast.py

          echo "✅ FULL PIPELINE COMPLETED SUCCESSFULLY!"
