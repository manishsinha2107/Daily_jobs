name: Probe Strategy State

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-probe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv pandas

      - name: Create and Run Probe Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cat << 'EOF' > probe_script.py
          import os
          from supabase import create_client
          from dotenv import load_dotenv

          if os.path.exists(".env"):
              load_dotenv()

          url = os.getenv("SUPABASE_URL")
          key = os.getenv("SUPABASE_KEY")
          
          if not url or not key:
              print("❌ Error: SUPABASE_URL or SUPABASE_KEY secrets missing from GitHub environment!")
              exit(1)

          supabase = create_client(url, key)

          def probe_strategy_31300070():
              strat_id = 31300070
              print(f"\n🔍 PROBING DATABASE STATE FOR STRATEGY ID: {strat_id}\n" + "="*50)
              
              strat = supabase.table("strategies").select("*").eq("strategy_id", strat_id).execute()
              print(f"📋 Strategy Metadata Found: {len(strat.data)} row(s)")
              if strat.data:
                  print(f"   Name: {strat.data[0].get('strategy_name')} | Status: {strat.data[0].get('status')} | Type: {strat.data[0].get('position_type')}")

              trades = supabase.table("strategy_trades_verification").select("*").eq("strategy_id", strat_id).execute()
              print(f"\n📦 Total Trades in Verification Table: {len(trades.data)}")
              
              pending_count = sum(1 for t in trades.data if t.get('ledger_status') == 'pending')
              missing_ohlc_count = sum(1 for t in trades.data if t.get('ohlc_status') == 'missing_ohlc_at_vault')
              print(f"   - Pending Ledger Status: {pending_count}")
              print(f"   - Missing OHLC at Vault: {missing_ohlc_count}")
              
              print("\n   Recent Pending/Missing Trades:")
              for t in trades.data:
                  if t.get('ledger_status') == 'pending':
                      print(f"   * Date: {t.get('trade_date')} | Symbol: {t.get('broker_symbol')} | OHLC Status: {t.get('ohlc_status')} | Ledger: {t.get('ledger_status')}")

              ledger = supabase.table("positional_trade_ledger").select("*").eq("strategy_id", strat_id).execute()
              print(f"\n📖 Cycles in Positional Trade Ledger: {len(ledger.data)}")
              
              symbols = list(set(t.get('broker_symbol') for t in trades.data if t.get('ledger_status') == 'pending'))
              print(f"\nPending symbols to check in cache: {symbols}")
              for sym in symbols:
                  ohlc_check = supabase.table("market_ohlc_cache").select("ts", count="exact").eq("symbol", sym).execute()
                  print(f"   - Symbol {sym}: {ohlc_check.count} candle(s) cached")

              print("\n" + "="*50)

          if __name__ == "__main__":
              probe_strategy_31300070()
          EOF
          
          python probe_script.py
