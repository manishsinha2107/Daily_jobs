# --- AFTER (PATCHED CODE | File: .github/workflows/validate_backfill.yml) ---
# [MODULE/CLASS SSOT ROLE]: Database Validation CI/CD
# [FUNCTION CONTRACT & MATH]: Executes the read-only cross-verification script remotely.
name: ✅ Validate Database Backfill

on:
  workflow_dispatch:

jobs:
  execute-validation:
    runs-on: ubuntu-latest
    steps:
      # [TECHNICAL]: Checkout repository to access the script.
      # [BUSINESS / DOMAIN LOGIC]: Grants the runner access to scripts/validate_backfill.py.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # [TECHNICAL]: Initializes Python runtime.
      # [BUSINESS / DOMAIN LOGIC]: Provides the ecosystem required to execute pandas diff operations.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # [TECHNICAL]: Installs data manipulation and Google API client libraries.
      # [BUSINESS / DOMAIN LOGIC]: Ensures the environment matches the exact dependencies used in the ingestion pipeline.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase google-auth google-api-python-client python-dotenv
          
      # [TECHNICAL]: Injects repository secrets as environment variables during execution.
      # [BUSINESS / DOMAIN LOGIC]: Secures the read-only connection to your Supabase and Google Drive environments.
      - name: Run Validation Script
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          SOURCE_FOLDER: ${{ secrets.SOURCE_FOLDER }}
        run: |
          echo "🚀 Starting Data Integrity Validation..."
          python scripts/validate_backfill.py